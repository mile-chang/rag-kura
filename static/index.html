<!DOCTYPE html>
<html lang="zh-TW" class="h-full" data-theme="system">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAG Knowledge Assistant — Multi-model chat with retrieval-augmented generation.">
    <title>RAG Knowledge Assistant</title>

    <!-- Anti-FOUC Theme Script -->
    <script>
        (function () {
            try {
                const theme = localStorage.getItem('rag-theme') || 'system';
                if (['system', 'light', 'dark'].includes(theme)) {
                    document.documentElement.setAttribute('data-theme', theme);
                } else {
                    document.documentElement.setAttribute('data-theme', 'system');
                }
            } catch (e) { }
        })();
    </script>

    <!-- Tailwind CSS v4 (CDN) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- JetBrains Mono for code, Noto Sans TC for Chinese body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style type="text/tailwindcss">
        @theme {
            --color-background: var(--bg-base);
            --color-sidebar: var(--bg-sidebar);
            --color-navbar: var(--bg-navbar);
            --color-surface: var(--bg-surface);
            --color-surface-2: var(--bg-surface-2);
            --color-input: var(--bg-input);
            --color-code: var(--bg-code);
            --color-hover: var(--bg-hover);
            
            --color-primary: var(--text-primary);
            --color-muted: var(--text-muted);
            --color-inverse: var(--text-inverse);
            
            --color-border: var(--border-base);
            --color-brand: var(--color-brand);
            --color-success: var(--color-success);
            --color-error: var(--color-error);
            --color-focus: var(--color-focus);
        }
    </style>

    <style>
        :root {
            color-scheme: light;
            --bg-base: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --bg-navbar: rgba(248, 250, 252, 0.85);
            --bg-surface: #ffffff;
            --bg-surface-2: #f1f5f9;
            --bg-input: #ffffff;
            --bg-code: #f1f5f9;
            --bg-hover: rgba(0, 0, 0, 0.05);

            --text-primary: #0f172a;
            --text-muted: #64748b;
            --text-inverse: #ffffff;

            --border-base: #e2e8f0;
            
            --color-brand: #4f46e5;
            --color-success: #10b981;
            --color-error: #ef4444;
            --color-focus: #818cf8;

            --bg-scrollbar: #cbd5e1;
            --bg-scrollbar-hover: #94a3b8;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --bg-base: #0b0f19;
            --bg-sidebar: #0f1521;
            --bg-navbar: rgba(11, 15, 25, 0.85);
            --bg-surface: #161b22;
            --bg-surface-2: rgba(255, 255, 255, 0.03);
            --bg-input: #161b22;
            --bg-code: #161b22;
            --bg-hover: rgba(255, 255, 255, 0.06);

            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --text-inverse: #ffffff;

            --border-base: rgba(255, 255, 255, 0.08);
            
            --color-brand: #6366f1;
            --color-success: #34d399;
            --color-error: #f87171;
            --color-focus: #6366f1;

            --bg-scrollbar: #2d3748;
            --bg-scrollbar-hover: #4a5568;
        }

        [data-theme="system"] {
            color-scheme: light dark;
        }

        @media (prefers-color-scheme: dark) {
            [data-theme="system"] {
                --bg-base: #0b0f19;
                --bg-sidebar: #0f1521;
                --bg-navbar: rgba(11, 15, 25, 0.85);
                --bg-surface: #161b22;
                --bg-surface-2: rgba(255, 255, 255, 0.03);
                --bg-input: #161b22;
                --bg-code: #161b22;
                --bg-hover: rgba(255, 255, 255, 0.06);

                --text-primary: #e2e8f0;
                --text-muted: #94a3b8;
                --text-inverse: #ffffff;

                --border-base: rgba(255, 255, 255, 0.08);
                
                --color-brand: #6366f1;
                --color-success: #34d399;
                --color-error: #f87171;
                --color-focus: #6366f1;

                --bg-scrollbar: #2d3748;
                --bg-scrollbar-hover: #4a5568;
            }
        }

        /* -- Base & Font -------------------------------------------------- */
        body {
            font-family: 'Noto Sans TC', system-ui, sans-serif;
        }

        code,
        pre {
            font-family: 'JetBrains Mono', monospace;
        }

        /* -- Scrollbar ---------------------------------------------------- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-scrollbar);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-scrollbar-hover);
        }

        /* -- Sidebar conversation item hover ------------------------------ */
        .conv-item {
            transition: background 0.15s ease;
        }

        .conv-item .delete-btn {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .conv-item:hover .delete-btn {
            opacity: 1;
        }

        /* -- Chat bubble entrance animation ------------------------------- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-bubble {
            animation: fadeInUp 0.25s ease-out;
        }

        /* -- Textarea auto-resize ----------------------------------------- */
        #message-input {
            resize: none;
            max-height: 400px;
            scrollbar-width: none;
        }

        #message-input::-webkit-scrollbar {
            display: none;
        }

        /* -- Spinner ------------------------------------------------------ */
        @keyframes pulse-dot {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        .thinking-dot {
            animation: pulse-dot 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* -- Toggle chip -------------------------------------------------- */
        .chip-active {
            background: color-mix(in srgb, var(--color-brand) 20%, transparent);
            border-color: var(--color-brand);
            color: var(--color-brand);
        }

        .chip-inactive {
            background: var(--bg-hover);
            border-color: var(--border-base);
            color: var(--text-muted);
        }

        /* -- Markdown code blocks inside chat ----------------------------- */
        .msg-content pre {
            background: var(--bg-code);
            border: 1px solid var(--border-base);
            border-radius: 6px;
            padding: 12px 16px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 0.85rem;
        }

        .msg-content code {
            background: var(--bg-hover);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .msg-content pre code {
            background: none;
            padding: 0;
        }

        .msg-content p {
            margin: 6px 0;
        }

        .msg-content ul,
        .msg-content ol {
            padding-left: 1.5em;
            margin: 6px 0;
        }

        .msg-content li {
            margin: 3px 0;
        }

        .msg-content h1,
        .msg-content h2,
        .msg-content h3 {
            font-weight: 600;
            margin: 12px 0 6px;
            color: var(--text-primary);
        }

        .msg-content h1 {
            font-size: 1.25rem;
        }

        .msg-content h2 {
            font-size: 1.1rem;
        }

        .msg-content h3 {
            font-size: 1rem;
        }

        .msg-content a {
            color: var(--color-brand);
            text-decoration: underline;
        }

        .msg-content blockquote {
            border-left: 3px solid var(--border-base);
            padding-left: 12px;
            color: var(--text-muted);
            margin: 8px 0;
        }

        .msg-content strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* -- Thinking accordion ------------------------------------------- */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .think-accordion .think-spinner {
            animation: spin 1.2s linear infinite;
        }

        /* Body is hidden by default (collapsed) */
        .think-accordion .think-body {
            display: none;
        }

        /* When .open is present, show the body */
        .think-accordion.open .think-body {
            display: block;
        }

        /* Rotate chevron when open */
        .think-accordion.open .think-chevron {
            transform: rotate(180deg);
        }

        .think-accordion .think-header {
            user-select: none;
            cursor: pointer;
        }
    </style>
</head>

<body class="h-full flex overflow-hidden bg-background text-primary transition-colors duration-200">

    <!-- ================================================================= -->
    <!-- SIDEBAR                                                           -->
    <!-- ================================================================= -->
    <aside id="sidebar" data-state="expanded" class="group w-64 data-[state=collapsed]:-ml-64 md:data-[state=collapsed]:ml-0 md:data-[state=collapsed]:w-16 flex-shrink-0 flex flex-col h-full border-r border-border bg-sidebar transition-all duration-300 ease-in-out relative z-30">

        <!-- New Chat button -->
        <div class="p-3 md:group-data-[state=collapsed]:p-2">
            <button id="btn-new-chat" onclick="handleNewChatClick()" title="New Chat" class="w-full flex items-center md:group-data-[state=collapsed]:justify-center gap-2 px-3 md:group-data-[state=collapsed]:px-0 py-2.5 rounded-lg text-sm font-medium
                           border border-border text-primary bg-surface hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer whitespace-nowrap">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
                </svg>
                <span class="md:group-data-[state=collapsed]:hidden">New Chat</span>
            </button>
        </div>

        <!-- Conversation list -->
        <nav id="conv-list" class="flex-1 overflow-y-auto px-2 space-y-0.5 md:group-data-[state=collapsed]:opacity-0 md:group-data-[state=collapsed]:invisible transition-opacity duration-200">
            <!-- Populated by JS -->
        </nav>

        <!-- User Profile -->
        <div class="relative border-t border-border p-3 md:group-data-[state=collapsed]:p-2 md:group-data-[state=collapsed]:flex md:group-data-[state=collapsed]:justify-center">
            <button id="btn-user-profile" onclick="handleProfileClick(event)" title="Log In" class="w-full flex items-center md:group-data-[state=collapsed]:justify-center gap-3 md:group-data-[state=collapsed]:gap-0 px-3 md:group-data-[state=collapsed]:px-0 py-2.5 rounded-lg hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer text-left">
                <div id="profile-avatar"
                    class="w-8 h-8 rounded-full bg-surface-2 border border-border flex-shrink-0 flex items-center justify-center text-muted">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div class="flex-1 min-w-0 md:group-data-[state=collapsed]:hidden">
                    <p id="profile-name" class="text-sm font-medium text-primary truncate">Log In</p>
                    <p id="profile-subtitle" class="text-xs text-muted truncate hidden"></p>
                </div>
                <svg id="profile-chevron" class="w-4 h-4 text-muted flex-shrink-0 hidden md:group-data-[state=collapsed]:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                </svg>
            </button>

            <!-- Account Dropdown Menu -->
            <div id="account-dropdown-menu" role="menu"
                class="hidden absolute bottom-[calc(100%+8px)] left-3 w-[calc(100%-24px)] md:group-data-[state=collapsed]:w-56 md:group-data-[state=collapsed]:left-2 bg-surface border border-border rounded-xl shadow-lg z-50 flex flex-col overflow-hidden text-sm">
                
                <!-- User Info Header -->
                <div class="px-3 py-3 border-b border-border flex items-center gap-3">
                    <div id="dropdown-profile-avatar" class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand to-purple-500 flex-shrink-0 flex items-center justify-center text-inverse text-sm font-semibold">U</div>
                    <div class="flex-1 min-w-0">
                        <p id="dropdown-profile-name" class="text-sm font-medium text-primary truncate">Guest User</p>
                    </div>
                </div>
                
                <!-- Menu Items -->
                <div class="py-1">
                    <button role="menuitem" tabindex="0" onclick="logout()" class="w-full flex items-center gap-2 px-3 py-2 text-left text-error hover:bg-hover focus:bg-hover outline-none transition-colors cursor-pointer">
                        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Log out
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- ================================================================= -->
    <!-- MAIN AREA                                                         -->
    <!-- ================================================================= -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-background transition-colors duration-200">

        <!-- Top bar -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-border bg-navbar backdrop-blur-md sticky top-0 z-20 transition-colors duration-200">
            <div class="flex items-center gap-3 min-w-0">
                <button id="btn-toggle-sidebar" onclick="toggleSidebar()" title="Toggle Sidebar"
                    class="p-1.5 rounded-lg hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors text-muted hover:text-primary cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div class="flex items-center gap-1.5 min-w-0 pr-4">
                    <h1 id="header-title" class="text-sm font-semibold text-primary truncate">RAG Knowledge Assistant</h1>
                    <button id="btn-edit-title" onclick="editConversationTitle()"
                        class="hidden text-muted hover:text-primary p-1 rounded hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer flex-shrink-0"
                        title="Edit Title">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15.232 5.232l3.536 3.536M9 11.5V15h3.5l9.5-9.5-3.5-3.5L9 11.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Theme Toggle -->
            <div class="relative">
                <button id="btn-theme-trigger" onclick="toggleThemeDropdown(event)" aria-haspopup="menu" aria-expanded="false"
                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm font-medium text-muted hover:text-primary hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer bg-transparent border-none">
                    <svg id="theme-icon-system" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    <svg id="theme-icon-light" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                    <svg id="theme-icon-dark" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                    <span id="theme-label" class="hidden sm:inline">System</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                </button>
                <div id="theme-dropdown-menu" role="menu"
                    class="hidden absolute top-[calc(100%+4px)] right-0 w-36 bg-surface border border-border rounded-xl shadow-lg z-50 py-1 flex flex-col overflow-hidden text-sm">
                    <button role="menuitem" tabindex="0" onclick="setTheme('light', event)" class="w-full flex items-center gap-2 px-3 py-2 text-left text-primary hover:bg-hover focus:bg-hover outline-none transition-colors cursor-pointer">
                        <svg class="w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        Light
                    </button>
                    <button role="menuitem" tabindex="0" onclick="setTheme('dark', event)" class="w-full flex items-center gap-2 px-3 py-2 text-left text-primary hover:bg-hover focus:bg-hover outline-none transition-colors cursor-pointer">
                        <svg class="w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
                        Dark
                    </button>
                    <button role="menuitem" tabindex="0" onclick="setTheme('system', event)" class="w-full flex items-center gap-2 px-3 py-2 text-left text-primary hover:bg-hover focus:bg-hover outline-none transition-colors cursor-pointer">
                        <svg class="w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                        System
                    </button>
                </div>
            </div>
        </header>

        <!-- Chat messages area -->
        <div id="chat-area" class="flex-1 overflow-y-auto">
            <div id="messages-container" class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                <!-- Welcome state -->
                <div id="welcome-state" class="flex flex-col items-center justify-center h-full pt-24">
                    <div class="text-3xl font-bold text-primary mb-2 tracking-tight">RAG Knowledge Assistant</div>
                    <p class="text-muted text-sm mb-8">Select a conversation or start a new one.</p>
                </div>
            </div>
        </div>

        <!-- Input area -->
        <div class="px-4 pb-6 pt-4 bg-gradient-to-t from-background via-background to-transparent relative z-10 transition-colors duration-200">
            <div
                class="max-w-3xl mx-auto bg-input border border-border rounded-[1.5rem] p-3 shadow-lg flex flex-col focus-within:border-brand focus-within:ring-1 focus-within:ring-brand transition-all duration-300">

                <textarea id="message-input" rows="1" placeholder="Type a message..."
                    class="w-full bg-transparent border-none px-3 py-2 text-[15px] text-primary placeholder-muted outline-none resize-none leading-relaxed min-h-[44px]"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>

                <!-- Toolbar & Actions -->
                <div class="flex items-center justify-between mt-2 px-1">
                    <!-- Left side: Tools -->
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('file-input').click()"
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border chip-inactive hover:border-muted hover:text-primary focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer" title="Upload documents to knowledge base">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            Upload
                        </button>
                        <input id="file-input" type="file" accept=".md,.pdf" multiple class="hidden"
                            onchange="handleFileUpload(this.files)">

                        <button id="btn-rag" onclick="toggleRAG()"
                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border chip-inactive hover:border-muted hover:text-primary focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477-4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                            Knowledge Base
                        </button>

                        <span id="upload-status" class="text-xs text-success hidden ml-2 font-medium"></span>
                    </div>

                    <!-- Right side: Modals and Submit -->
                    <div class="flex items-center gap-2">
                        <!-- Custom Model Selector -->
                        <div class="relative">
                            <button id="btn-model-trigger" onclick="toggleModelDropdown(event)" aria-haspopup="menu"
                                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[13px] font-medium text-primary hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none transition-colors cursor-pointer bg-transparent border-none">
                                <span id="current-model-label">Qwen 3.5 2B</span>
                                <svg class="w-3.5 h-3.5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <div id="model-dropdown-menu" role="menu"
                                class="hidden absolute bottom-[calc(100%+8px)] right-0 w-60 bg-surface border border-border rounded-2xl shadow-xl z-50 py-1 flex flex-col overflow-hidden text-[13px]">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Send Button -->
                        <button id="btn-send" onclick="sendMessage()"
                            class="w-9 h-9 rounded-full bg-brand text-inverse hover:opacity-90 focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-2 outline-none flex items-center justify-center transition-all disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer ml-1" disabled>
                            <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                        <!-- Stop Button -->
                        <button id="btn-stop" onclick="stopGeneration()" class="w-9 h-9 rounded-full bg-surface-2 border border-border hover:bg-hover focus-visible:ring-2 focus-visible:ring-focus outline-none items-center justify-center transition-colors cursor-pointer ml-1 hidden"
                            title="Stop Generation">
                            <svg class="w-3.5 h-3.5 text-error fill-current" viewBox="0 0 16 16">
                                <rect width="10" height="10" x="3" y="3" rx="2" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- New Chat Warning Modal -->
    <div id="new-chat-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-surface border border-border rounded-2xl shadow-xl w-full max-w-[360px] mx-4 p-6 transform scale-95 transition-transform duration-200" id="new-chat-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-primary tracking-tight">Start New Chat?</h2>
                <button onclick="closeNewChatModal()" class="text-muted hover:text-primary transition-colors outline-none focus-visible:ring-2 focus-visible:ring-brand rounded cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <p class="text-sm text-muted mb-6 leading-relaxed">
                As a guest, your current conversation is only saved locally. Starting a new chat will clear the current screen. Log in to save it permanently.
            </p>
            <div class="flex flex-col gap-2.5">
                <button onclick="confirmNewChat()" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-inverse bg-brand hover:bg-brand/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand transition-colors cursor-pointer">
                    Clear & Start New
                </button>
                <button onclick="openAuthFromNewChat()" class="w-full flex justify-center items-center py-2.5 px-4 border border-border rounded-lg shadow-sm text-sm font-medium text-primary bg-surface hover:bg-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand transition-colors cursor-pointer">
                    Log In
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
