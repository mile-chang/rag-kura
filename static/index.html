<!DOCTYPE html>
<html lang="zh-TW" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAG Knowledge Assistant — Multi-model chat with retrieval-augmented generation.">
    <title>RAG Knowledge Assistant</title>

    <!-- Tailwind CSS v4 (CDN) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- JetBrains Mono for code, Noto Sans TC for Chinese body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* -- Base & Font -------------------------------------------------- */
        body {
            font-family: 'Noto Sans TC', system-ui, sans-serif;
            background: #0b0f19;
            color: #c9d1d9;
        }

        code,
        pre {
            font-family: 'JetBrains Mono', monospace;
        }

        /* -- Scrollbar ---------------------------------------------------- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a5568;
        }

        /* -- Sidebar conversation item hover ------------------------------ */
        .conv-item {
            transition: background 0.15s ease;
        }

        .conv-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .conv-item .delete-btn {
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .conv-item:hover .delete-btn {
            opacity: 1;
        }

        /* -- Chat bubble entrance animation ------------------------------- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-bubble {
            animation: fadeInUp 0.25s ease-out;
        }

        /* -- Textarea auto-resize ----------------------------------------- */
        #message-input {
            resize: none;
            max-height: 400px;
            scrollbar-width: none;
        }
        #message-input::-webkit-scrollbar {
            display: none;
        }

        /* -- Spinner ------------------------------------------------------ */
        @keyframes pulse-dot {

            0%,
            80%,
            100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        .thinking-dot {
            animation: pulse-dot 1.4s infinite ease-in-out;
        }

        .thinking-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* -- Toggle chip -------------------------------------------------- */
        .chip-active {
            background: rgba(99, 102, 241, 0.25);
            border-color: #6366f1;
            color: #a5b4fc;
        }

        .chip-inactive {
            background: rgba(255, 255, 255, 0.04);
            border-color: #2d3748;
            color: #64748b;
        }

        /* -- Markdown code blocks inside chat ----------------------------- */
        .msg-content pre {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 12px 16px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 0.85rem;
        }

        .msg-content code {
            background: rgba(110, 118, 129, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
        }

        .msg-content pre code {
            background: none;
            padding: 0;
        }

        .msg-content p {
            margin: 6px 0;
        }

        .msg-content ul,
        .msg-content ol {
            padding-left: 1.5em;
            margin: 6px 0;
        }

        .msg-content li {
            margin: 3px 0;
        }

        .msg-content h1,
        .msg-content h2,
        .msg-content h3 {
            font-weight: 600;
            margin: 12px 0 6px;
            color: #e2e8f0;
        }

        .msg-content h1 {
            font-size: 1.25rem;
        }

        .msg-content h2 {
            font-size: 1.1rem;
        }

        .msg-content h3 {
            font-size: 1rem;
        }

        .msg-content a {
            color: #818cf8;
            text-decoration: underline;
        }

        .msg-content blockquote {
            border-left: 3px solid #4a5568;
            padding-left: 12px;
            color: #94a3b8;
            margin: 8px 0;
        }

        .msg-content strong {
            color: #e2e8f0;
            font-weight: 600;
        }
    </style>
</head>

<body class="h-full flex overflow-hidden">

    <!-- ================================================================= -->
    <!-- SIDEBAR                                                           -->
    <!-- ================================================================= -->
    <aside id="sidebar" class="w-64 flex-shrink-0 flex flex-col h-full border-r border-white/[0.06]"
        style="background: #0f1521;">

        <!-- New Chat button -->
        <div class="p-3">
            <button id="btn-new-chat" onclick="createConversation()" class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-medium
                           border border-white/[0.08] text-slate-300
                           hover:bg-white/[0.06] transition-colors cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                New Chat
            </button>
        </div>

        <!-- Conversation list -->
        <nav id="conv-list" class="flex-1 overflow-y-auto px-2 space-y-0.5">
            <!-- Populated by JS -->
        </nav>

        <!-- User Profile (Placeholder) -->
        <div class="border-t border-white/[0.06] p-3">
            <button class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg
                           hover:bg-white/[0.06] transition-colors cursor-pointer text-left">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex-shrink-0 flex items-center justify-center text-white text-sm font-semibold">
                    U
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-slate-200 truncate">Guest User</p>
                    <p class="text-xs text-slate-500 truncate">Local Session</p>
                </div>
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
                </svg>
            </button>
        </div>
    </aside>

    <!-- ================================================================= -->
    <!-- MAIN AREA                                                         -->
    <!-- ================================================================= -->
    <main class="flex-1 flex flex-col h-full min-w-0">

        <!-- Top bar (mobile sidebar toggle + title) -->
        <header class="flex items-center gap-3 px-4 py-3 border-b border-white/[0.06]"
            style="background: rgba(11,15,25,0.85); backdrop-filter: blur(12px);">
            <button id="btn-toggle-sidebar" onclick="toggleSidebar()"
                class="lg:hidden p-1.5 rounded-lg hover:bg-white/[0.06] transition-colors text-slate-400 cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="flex items-center gap-1.5 min-w-0 pr-4">
                <h1 id="header-title" class="text-sm font-semibold text-slate-300 truncate">RAG Knowledge Assistant</h1>
                <button id="btn-edit-title" onclick="editConversationTitle()" class="hidden text-slate-500 hover:text-slate-300 p-1 rounded transition-colors cursor-pointer flex-shrink-0" title="編輯標題">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536M9 11.5V15h3.5l9.5-9.5-3.5-3.5L9 11.5z"></path></svg>
                </button>
            </div>
        </header>

        <!-- Chat messages area -->
        <div id="chat-area" class="flex-1 overflow-y-auto">
            <div id="messages-container" class="max-w-3xl mx-auto px-4 py-6 space-y-5">
                <!-- Welcome state (shown when no conversation is active) -->
                <div id="welcome-state" class="flex flex-col items-center justify-center h-full pt-24">
                    <div class="text-3xl font-bold text-slate-300 mb-2 tracking-tight">RAG Knowledge Assistant</div>
                    <p class="text-slate-500 text-sm mb-8">Select a conversation or start a new one.</p>
                </div>
            </div>
        </div>

        <!-- Input area (floating bottom, Gemini style) -->
        <div class="px-4 pb-6 pt-4 bg-gradient-to-t from-[#0b0f19] via-[rgba(11,15,25,0.95)] to-transparent relative z-10">
            <div class="max-w-3xl mx-auto bg-[#161b22] border border-white/[0.08] rounded-[1.5rem] p-3 shadow-2xl flex flex-col focus-within:border-white/[0.2] focus-within:bg-[#1a202c] transition-all duration-300">
                
                <!-- Input area -->
                <textarea id="message-input" rows="1" placeholder="Type a message..."
                    class="w-full bg-transparent border-none px-3 py-2 text-[15px] text-slate-200 placeholder-slate-500 outline-none resize-none leading-relaxed min-h-[44px]"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>

                <!-- Toolbar & Actions below input -->
                <div class="flex items-center justify-between mt-2 px-1">
                    <!-- Left side: Tools -->
                    <div class="flex items-center gap-2">
                        <!-- Upload button -->
                        <button onclick="document.getElementById('file-input').click()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border
                                       chip-inactive hover:border-slate-500 hover:text-slate-200 transition-colors cursor-pointer"
                            title="Upload documents to knowledge base">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                            </svg>
                            Upload
                        </button>
                        <input id="file-input" type="file" accept=".md,.pdf" multiple class="hidden"
                            onchange="handleFileUpload(this.files)">

                        <!-- Knowledge Base toggle -->
                        <button id="btn-rag" onclick="toggleRAG()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium border
                                       chip-inactive hover:border-slate-500 hover:text-slate-200 transition-colors cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477-4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                            Knowledge Base
                        </button>

                        <!-- Upload status indicator -->
                        <span id="upload-status" class="text-xs text-emerald-400 hidden ml-2"></span>
                    </div>

                    <!-- Right side: Modals and Submit -->
                    <div class="flex items-center gap-2">
                        <!-- Custom Model Selector -->
                        <div class="relative">
                            <button id="btn-model-trigger" onclick="toggleModelDropdown(event)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[13px] font-medium text-slate-300 hover:bg-white/[0.08] transition-colors cursor-pointer bg-transparent border-none">
                                <span id="current-model-label">Qwen 3.5 2B</span>
                                <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </button>

                            <!-- Dropdown Menu -->
                            <div id="model-dropdown-menu" class="hidden absolute bottom-[calc(100%+8px)] right-0 w-60 bg-[#1e232b] border border-white/[0.08] rounded-2xl shadow-2xl z-50 py-1 flex flex-col overflow-hidden text-[13px]">
                                <!-- Populated by JS -->
                            </div>
                        </div>

                        <!-- Send Button -->
                        <button id="btn-send" onclick="sendMessage()" class="w-9 h-9 rounded-full bg-white text-black hover:bg-slate-200
                                       flex items-center justify-center transition-colors
                                       disabled:opacity-20 disabled:hover:bg-white disabled:cursor-not-allowed cursor-pointer ml-1" disabled>
                            <svg class="w-4 h-4 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>
                        <!-- Stop Button -->
                        <button id="btn-stop" onclick="stopGeneration()" class="w-9 h-9 rounded-full bg-[#1e2338] hover:bg-[#282d46]
                                       items-center justify-center transition-colors cursor-pointer ml-1 hidden" title="停止回覆">
                            <svg class="w-3.5 h-3.5 text-indigo-200 fill-current" viewBox="0 0 16 16">
                                <rect width="10" height="10" x="3" y="3" rx="2" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
